[package]
name = "smg-iso-verifier"
version = "0.1.0"
edition = "2021"
description = "Range-fed Super Mario Galaxy ISO verifier and selective extractor for the browser"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["verifier-probe"]
verifier-probe = []
processor = []
asset-assembler = []
assetc-linked = ["processor", "asset-assembler"]

[dependencies]
nod = { git = "https://github.com/encounter/nod.git", tag = "v2.0.0-alpha.9", default-features = false }
sha2 = "0.10"
serde_json = "1"
encoding_rs = "0.8"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
itoa = "1.0.18"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
