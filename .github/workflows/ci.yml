name: CI

on:
  push:
  pull_request:

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime test image
        run: docker build -t smg-runtime-tests -f tools/tests/Dockerfile .
      - name: Run runtime and tooling checks
        run: sh tools/run_ci.sh
